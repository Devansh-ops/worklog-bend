name: Bend toolchain
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  compiler-and-verdict:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '25.8.1'
      - run: node scripts/install-bend.mjs
      - run: node scripts/install-proof-tools.mjs
      - run: sh scripts/test-bend-verdict.sh
